    status: planned
  - id: SEC-SYNC-02
    statement: "Only GET /api/sync/shape reaches Electric, every shape is registered server-side, and an unregistered table or column answers 403 SHAPE_FORBIDDEN."
    boundary: B5
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-270, PAP-219, PAP-31]
    standard: "ADR 0004 permissionRules"
    status: planned
  - id: SEC-SYNC-03
    statement: "The shape proxy sets the table, the tenant predicate and the column list from the server-side registry; a client-supplied filter may only narrow the result with AND and can never widen or replace the tenant predicate."
    boundary: B5
