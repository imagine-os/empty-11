# PaperOS security controls (PAP-219, ADR 0024).
#
# The machine-readable half of `docs/security/threat-model.md` and
# `docs/security/hardening-baseline.md`. Every control named in either document has an id here, and
# every id cited in a document, a Semgrep rule (PAP-80), the security reviewer prompt (PAP-81) or a
# review rubric (PAP-79) must resolve to a control in this file.
#
# Format is a deliberately small YAML subset so that `node scripts/security-controls.ts --check`
# can validate it with no dependencies, and so a Zod schema (PAP-80) can mirror it exactly:
#
#   version: <int>            # bump when the field set changes
#   updated: YYYY-MM-DD
#   boundaries: { <id>: "<name>" }
#   controls:
#     - id: SEC-<AREA>-<nn>   # unique, uppercase area, two digits
#       statement: "..."      # one sentence, imperative, testable; double quotes, no inner quotes
#       boundary: B<n>        # the primary boundary from `boundaries` above
#       verify: lint|test|scan|manual
#       cadence: "..."        # required when verify is manual, else null
#       owner: <character>    # Atlas | Forge | Sentinel | Iris | Nova | Ledger | Beacon | Quill | Scout
#       issues: [PAP-n, ...]  # the issues that implement or enforce it; first is the primary owner
#       standard: "..."       # external anchor with a version or date
#       status: enforced|partial|planned
#
# Rules: append-only ids (retire by setting status to `planned` with a superseding id in the
# statement, never renumber); `verify: manual` always carries a cadence (threat-model edge case);
# every issue key must exist in Linear team PAP.

version: 1
updated: 2026-09-19

boundaries:
  B1: "Browser and PWA"
  B2: "Tauri shell (WebView, IPC, deep link, updater, keychain)"
  B3: "API (Hono + oRPC, auth routes, webhooks)"
  B4: "Postgres and RLS"
  B5: "Sync read path (Electric shape proxy, PGlite local store)"
  B6: "Jobs and scheduler (pg-boss)"
  B7: "Realtime and collaboration (Hocuspocus/Yjs, live_event)"
  B8: "Agents and orchestrator (sessions, orchestrator host)"
  B9: "Forges and CI (Forgejo, GitHub mirror, runners)"
  B10: "Third parties (Stripe, payroll, Resend, Linear, Anthropic, Tailscale)"

controls:
  # --- Response headers -------------------------------------------------------------------------
  - id: SEC-HDR-01
    statement: "Every HTML and JSON response from apps/web and apps/api carries the header profile named in ops/security/headers.json for its surface; a response with no profile is a build failure."
    boundary: B1
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-35, PAP-78]
    standard: "OWASP Secure Headers Project; ASVS 5.0.0 V13 Configuration (2025-05-30)"
    status: planned
  - id: SEC-HDR-02
    statement: "Every public host sends Strict-Transport-Security with max-age 63072000, includeSubDomains and preload, and redirects port 80 to HTTPS."
    boundary: B1
    verify: scan
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-26]
    standard: "hstspreload.org submission requirements, retrieved 2026-09-19 (max-age at least 31536000; we set two years)"
    status: planned
  - id: SEC-HDR-03
    statement: "X-Content-Type-Options is nosniff on every response and every response that carries a body declares an explicit Content-Type with a charset."
    boundary: B1
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-35]
    standard: "OWASP HTTP Headers Cheat Sheet, retrieved 2026-09-19"
    status: planned
  - id: SEC-HDR-04
    statement: "Referrer-Policy is strict-origin-when-cross-origin on every surface, and no route puts a token, an id or a tenant slug in a query string that a third party could receive."
    boundary: B1
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-16]
    standard: "Referrer Policy (W3C CR); OWASP Top 10:2025 A02 Security Misconfiguration"
    status: planned
  - id: SEC-HDR-05
    statement: "Framing is denied by CSP frame-ancestors none plus the legacy X-Frame-Options DENY, and Cross-Origin-Opener-Policy is same-origin with Cross-Origin-Resource-Policy same-origin, except on routes listed as embeddable in ops/security/headers.json."
    boundary: B1
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-215]
    standard: "CSP Level 3 W3C WD 2026-08-13; OWASP CORP control page, retrieved 2026-09-19"
    status: planned
  - id: SEC-HDR-06
    statement: "Permissions-Policy denies camera, microphone, geolocation, payment, usb, serial, display-capture and idle-detection unless the page spec of the route declares the feature, so an undeclared capability cannot be used."
    boundary: B1
    verify: lint
    cadence: null
    owner: Iris
    issues: [PAP-219, PAP-114, PAP-16]
    standard: "Permissions Policy (W3C WD); ASVS 5.0.0 V3 Web Frontend Security"
    status: planned
  - id: SEC-HDR-07
    statement: "No response advertises a server, framework or language version: Server, X-Powered-By and equivalents are stripped at the edge and in Hono."
    boundary: B3
    verify: scan
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-26]
    standard: "OWASP Top 10:2025 A02 Security Misconfiguration"
    status: planned

  # --- Content Security Policy ------------------------------------------------------------------
  - id: SEC-CSP-01
    statement: "Every HTML response mints a fresh 128-bit CSPRNG nonce, exposes it on the request context key CSP_NONCE, and never reuses or caches it across responses."
    boundary: B1
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-35]
    standard: "CSP Level 3 W3C WD 2026-08-13, nonce-source"
    status: planned
  - id: SEC-CSP-02
    statement: "The app policy is script-src self plus the per-response nonce plus strict-dynamic, with object-src none, base-uri none, form-action self and default-src self; unsafe-inline and unsafe-eval never appear in an app profile."
    boundary: B1
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-16]
    standard: "CSP Level 3 W3C WD 2026-08-13, strict-dynamic; OWASP Top 10:2025 A05 Injection"
    status: planned
  - id: SEC-CSP-03
    statement: "connect-src lists exact origins for the API, the Electric shape proxy, the Hocuspocus WebSocket and the telemetry collector, and no CSP directive in an app profile contains a wildcard host or a scheme-only source."
    boundary: B1
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-270, PAP-140, PAP-40]
    standard: "CSP Level 3 W3C WD 2026-08-13, source expressions"
    status: planned
  - id: SEC-CSP-04
    statement: "Application source contains no inline event handler attributes, no javascript: URLs, no document.write and no eval or new Function; framework-rendered inline scripts carry the nonce."
    boundary: B1
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-80]
    standard: "ASVS 5.0.0 V1 Encoding and Sanitization; OWASP Top 10:2025 A05"
    status: planned
  - id: SEC-CSP-05
    statement: "CSP violations are reported to /api/v1/security/csp-report with report-to and report-uri, rate limited and sampled, and a new violation class opens a Sentinel finding rather than a policy relaxation."
    boundary: B3
    verify: test
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-40]
    standard: "CSP Level 3 W3C WD 2026-08-13, reporting"
    status: planned
  - id: SEC-CSP-06
    statement: "A relaxed policy exists only for the host profiles named in ops/security/headers.json (storybook, pages-demo, embedded-oss), each scoped to its own origin or route prefix, and never for an app profile."
    boundary: B1
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-215, PAP-76]
    standard: "ASVS 5.0.0 V13 Configuration"
    status: planned
  - id: SEC-CSP-07
    statement: "Trusted Types (require-trusted-types-for script) ship report-only on apps/web and are only enforced once every Tauri WebView in the device matrix is confirmed to support them."
    boundary: B2
    verify: manual
    cadence: "quarterly, with the device-matrix review (ADR 0022)"
    owner: Sentinel
    issues: [PAP-219, PAP-14, PAP-19]
    standard: "Trusted Types (W3C WD); CSP Level 3 W3C WD 2026-08-13"
    status: planned

  # --- CSRF ------------------------------------------------------------------------------------
  - id: SEC-CSRF-01
    statement: "Every mutating route rejects a request whose Origin or Sec-Fetch-Site does not match an allowlisted origin, before any handler runs."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-35, PAP-57]
    standard: "OWASP CSRF Prevention Cheat Sheet, retrieved 2026-09-19; ASVS 5.0.0 V4 API and Web Service"
    status: planned
  - id: SEC-CSRF-02
    statement: "A cookie-authenticated mutation requires both the SameSite cookie and the origin check; a bearer-authenticated mutation (Tauri, agents, SDK) is exempt from the origin check and is rejected if it also carries a session cookie."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-225, PAP-60]
    standard: "OWASP CSRF Prevention Cheat Sheet, retrieved 2026-09-19"
    status: planned
  - id: SEC-CSRF-03
    statement: "GET, HEAD and OPTIONS never change state: no oRPC query procedure and no REST GET route writes, enqueues a job or emits an event."
    boundary: B3
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-80, PAP-267]
    standard: "RFC 9110 section 9.2.1 safe methods"
    status: planned

  # --- Cookies ---------------------------------------------------------------------------------
  - id: SEC-COOK-01
    statement: "The session cookie is __Host-paperos_session with Secure, HttpOnly, SameSite=Lax, Path=/ and no Domain attribute; no other cookie carries a credential."
    boundary: B1
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-57]
    standard: "draft-ietf-httpbis-rfc6265bis-20 cookie prefixes (Internet-Draft, current 2026-09-19); ASVS 5.0.0 V7 Session Management"
    status: planned
  - id: SEC-COOK-02
    statement: "No surface stores a token, key or session in localStorage, sessionStorage, IndexedDB or the PGlite local database."
    boundary: B1
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-80, PAP-31]
    standard: "ASVS 5.0.0 V7 Session Management; ADR 0003 decision 5"
    status: planned
  - id: SEC-COOK-03
    statement: "The Tauri shell keeps its bearer token in the OS keychain only, sends it with requireSignature true, and holds no token in the WebView at rest."
    boundary: B2
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-17, PAP-225, PAP-260]
    standard: "ADR 0003 decision 5 (2026-09-19); docs/research/auth-libraries.md section 4"
    status: planned

  # --- CORS ------------------------------------------------------------------------------------
  - id: SEC-CORS-01
    statement: "CORS allows credentials only for exact origins from the deployment allowlist plus tauri://localhost, never a wildcard, never an origin reflected from the request, and never a suffix match."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-35, PAP-19]
    standard: "OWASP Top 10:2025 A02; ASVS 5.0.0 V4 API and Web Service"
    status: planned
  - id: SEC-CORS-02
    statement: "Preflight responses enumerate allowed methods and headers explicitly, cap Access-Control-Max-Age at 600 seconds, and expose only x-request-id and Retry-After."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-35]
    standard: "Fetch Standard, CORS protocol, retrieved 2026-09-19"
    status: planned

  # --- Rate limits and quotas -------------------------------------------------------------------
  - id: SEC-RATE-01
    statement: "Rate limits are enforced per actor at 600 requests per minute, per API key at its configured limit and per IP at 60 per minute on public routes, all Postgres-backed, answering 429 with Retry-After."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-35, PAP-222]
    standard: "Contracts section 4 (interface-and-data-contracts.md); ASVS 5.0.0 V4"
    status: planned
  - id: SEC-RATE-02
    statement: "Authentication, password reset, magic link and API-key mint routes are limited to 10 attempts per minute per IP and per identifier with exponential backoff, and lockouts are audited."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-57, PAP-60]
    standard: "NIST SP 800-63B-4 rate-limiting of authentication attempts (final, 2025-08); OWASP Top 10:2025 A07"
    status: planned
  - id: SEC-RATE-03
    statement: "List inputs cap limit at 100, batch endpoints at 25 mutations and bulk patches at 500 ids, enforced by the shared Zod input schemas rather than per route."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-268, PAP-35]
    standard: "Contracts section 4; ASVS 5.0.0 V2 Validation and Business Logic"
    status: planned
  - id: SEC-RATE-04
    statement: "Payload caps are enforced before parsing: 1 MB JSON bodies, 100 MB uploads through the file service, 20 MB per Yjs document and 25 MB per shape response."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-37, PAP-140, PAP-270]
    standard: "ASVS 5.0.0 V2; OWASP Top 10:2025 A10 Mishandling of Exceptional Conditions"
    status: planned

  # --- Authentication and session ---------------------------------------------------------------
  - id: SEC-AUTH-01
    statement: "Passkeys are the primary human factor; password and magic-link fallbacks require a second factor, and any change to the factor set is an ADR."
    boundary: B1
    verify: manual
    cadence: "quarterly, by Sentinel with the identity owner"
    owner: Sentinel
    issues: [PAP-219, PAP-57, PAP-220]
    standard: "NIST SP 800-63B-4 AAL2 syncable authenticators (final, 2025-08); ADR 0003"
    status: planned
  - id: SEC-AUTH-02
    statement: "The desktop shell never calls navigator.credentials inside the WebView: authentication opens the system browser for an authorization-code flow with PKCE and returns on a single-use, PKCE-bound paperos://auth/callback deep link."
    boundary: B2
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-225, PAP-80]
    standard: "ADR 0003 decision 5; RFC 8252 OAuth 2.0 for Native Apps"
    status: planned
  - id: SEC-AUTH-03
    statement: "Bearer sessions are signed (requireSignature true) with an 8 hour maximum lifetime, are bound to the principal and are revocable by deleting the row, not by waiting for expiry."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-57, PAP-60]
    standard: "ASVS 5.0.0 V7 Session Management; ADR 0003"
    status: planned
  - id: SEC-AUTH-04
    statement: "Every oRPC procedure and REST route declares an authorize() policy; a route with no policy fails the build rather than defaulting to authenticated."
    boundary: B3
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-80, PAP-229, PAP-59]
    standard: "OWASP Top 10:2025 A01 Broken Access Control; ASVS 5.0.0 V8 Authorization"
    status: planned
  - id: SEC-AUTH-05
    statement: "Client-side permission helpers only hide UI: every capability they gate is re-checked on the server, and the permission matrix tests assert both layers."
    boundary: B3
    verify: test
    cadence: null
    owner: Sentinel
    issues: [PAP-219, PAP-64, PAP-229]
    standard: "OWASP Top 10:2025 A01; ASVS 5.0.0 V8"
    status: planned
  - id: SEC-AUTH-06
    statement: "The tenant taken from the x-tenant header or subdomain is resolved to an active membership of the authenticated principal before any RLS context is set; a mismatch is 404, never 403 with detail."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-219, PAP-58, PAP-34]
    standard: "Contracts section 1 and 4; OWASP Top 10:2025 A01"
    status: planned

  # --- Keys and credentials ---------------------------------------------------------------------
  - id: SEC-KEY-01
    statement: "Agent keys with the pos_agent_ prefix are minted only by the orchestrator, carry character, issue, session and scopes metadata, expire within 8 hours and are rate limited per key."
    boundary: B8
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-60, PAP-219, PAP-96]
    standard: "ADR 0003 decision 4; ASVS 5.0.0 V6 Authentication"
    status: planned
  - id: SEC-KEY-02
    statement: "API keys are stored only as a hash: PAP-60 reads the hashing scheme out of the api-key plugin source before the first key is minted and hashes them in our own code if the library stores anything reversible."
    boundary: B4
    verify: test
    cadence: null
    owner: Sentinel
    issues: [PAP-60, PAP-219]
    standard: "docs/research/auth-libraries.md section 6 open question (2026-09-19); ASVS 5.0.0 V11 Cryptography"
    status: planned
  - id: SEC-KEY-03
    statement: "Tenant keys are prefixed pos_live_ or pos_test_, a test key can only reach test data, and X-PaperOS-Env test never resolves to a live tenant."
    boundary: B3
    verify: test
    cadence: null
    owner: Ledger
    issues: [PAP-222, PAP-219]
    standard: "Contracts section 4; ASVS 5.0.0 V13 Configuration"
    status: planned
  - id: SEC-KEY-04
    statement: "Revocation is immediate: deleting a key or session takes effect within 60 seconds everywhere, and pnpm revoke --all kills every agent credential in under a minute."
    boundary: B8
    verify: manual
    cadence: "monthly, timed, in the incident drill"
    owner: Sentinel
    issues: [PAP-60, PAP-219, PAP-111]
    standard: "NIST SP 800-61r3 containment (2025-04-03)"
    status: planned

  # --- Tenancy and RLS ---------------------------------------------------------------------------
  - id: SEC-RLS-01
    statement: "Every tenant-scoped table has RLS enabled and FORCE ROW LEVEL SECURITY, and a query with no app.tenant_id returns no rows rather than all rows."
    boundary: B4
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-34, PAP-219, PAP-32]
    standard: "Contracts section 1; OWASP Top 10:2025 A01"
    status: planned
  - id: SEC-RLS-02
    statement: "The application role paperos_app is NOBYPASSRLS and is the only role the API and jobs connect as; paperos_owner is used by the migrator connection only and never by a request path."
    boundary: B4
    verify: scan
    cadence: null
    owner: Forge
    issues: [PAP-30, PAP-34, PAP-219]
    standard: "PostgreSQL 17 row security policies; ASVS 5.0.0 V8"
    status: planned
  - id: SEC-RLS-03
    statement: "Request context is set with SET LOCAL inside the request transaction only, so it cannot leak across pooled connections, and the tenant, actor, actor kind, request id and reason are all set together."
    boundary: B4
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-34, PAP-38, PAP-219]
    standard: "Contracts section 1"
    status: planned
  - id: SEC-RLS-04
    statement: "app.bypass is never set from a request handler; setting it requires a named platform job, writes an audit row and emits a security event that reaches the weekly digest."
    boundary: B4
    verify: lint
    cadence: null
    owner: Sentinel
    issues: [PAP-34, PAP-38, PAP-219]
    standard: "Contracts section 1; ASVS 5.0.0 V16 Security Logging and Error Handling"
    status: planned
  - id: SEC-RLS-05
    statement: "Every tenant-scoped table is covered by a cross-tenant denial test that fails if a second tenant can read, write or count its rows."
    boundary: B4
    verify: test
    cadence: null
    owner: Sentinel
    issues: [PAP-34, PAP-219, PAP-64]
    standard: "OWASP Top 10:2025 A01; ASVS 5.0.0 V8"
    status: planned
  - id: SEC-RLS-06
    statement: "A policy denial (SQLSTATE 42501) maps to NOT_FOUND on reads and FORBIDDEN on writes, and no error body, header or timing difference reveals that a row exists in another tenant."
    boundary: B3
    verify: test
    cadence: null
    owner: Forge
    issues: [PAP-35, PAP-219]
    standard: "Contracts section 4; ASVS 5.0.0 V16"
    status: planned

  # --- Sync read path ----------------------------------------------------------------------------
  - id: SEC-SYNC-01
    statement: "The Electric HTTP port is never published outside the compose network, and the shape proxy is the only process that may open a connection to it."
    boundary: B5
    verify: scan
    cadence: null
    owner: Forge
    issues: [PAP-31, PAP-270, PAP-219]
