# PaperOS local dev stack (PAP-42). One command, one disposable backing
# stack: `bin/up.sh` (see ../README.md). Every service binds to a fixed
# localhost port and keeps its state in a named volume so `bin/down.sh`
# (stop, keep data) and `bin/reset.sh` (stop, drop data) are predictable.
#
# Deviation from the PAP-42 spec text (recorded in the PAP-42 Session ended
# comment and docs/platform/dev-stack.md "Deviations"): the full spec asks for
# per-worktree databases (a worktree-path hash driving a port offset and a
# distinct project name so N parallel Claude sessions never collide) plus a
# `.claude/hooks/session-start.sh` hook and a `pnpm stack *` script package.
# This pass ships one shared stack on fixed ports with plain shell wrappers
# instead — the coordinating brief for this issue narrowed the scope to that
# (see the issue's `Session started` comment paths). Per-worktree isolation,
# the hook and the `pnpm stack` scripts are follow-up issues (see the dev-stack
# doc). `docker compose down` (bin/down.sh) is always safe to run from any
# worktree; only one worktree at a time should run `bin/up.sh` until the
# follow-up lands.
#
# Hocuspocus is intentionally not included yet: there is no published
# Hocuspocus Docker image (it ships as an npm library you wrap in your own
# server), so adding it here would mean authoring and maintaining a Dockerfile
# out of this issue's scope. `YJS_URL` is documented in `.env.example` as a
# placeholder (not wired) — see docs/platform/dev-stack.md "Deviations".
services:
  # Postgres 17 with the extensions the schema work (PAP-32, PAP-30) needs
  # pre-installed, `wal_level=logical` for Electric's publication, and the
  # roles PAP-30/PAP-42 name so PAP-34's RLS tests run the same locally as on
  # staging.
  postgres:
    image: pgvector/pgvector:pg17
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: paperos_owner
      POSTGRES_PASSWORD: paperos_dev_local
      POSTGRES_DB: paperos_dev
    ports:
      - '5432:5432'
    volumes:
      - paperos-dev-postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperos_owner -d paperos_dev']
      interval: 5s
      timeout: 3s
      retries: 20

  # Read-path sync (ADR 0004, PAP-31/PAP-36). Connects with the `electric`
  # role over a direct (non-pooled) connection, as the ADR requires.
  electric:
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgresql://electric:paperos_dev_local@postgres:5432/paperos_dev?sslmode=disable
      ELECTRIC_INSECURE: 'true'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:3000/v1/health']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. Console (9001) is the smoke probe's target
  # (see ../smoke.json) since it is a real HTTP admin UI, same pattern as
  # ops/compose/example-postgres.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: paperos_dev
      MINIO_ROOT_PASSWORD: paperos_dev_local
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - paperos-dev-minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the `paperos-dev` bucket once MinIO is healthy, then exits.
  # `docker compose up --wait` does not wait on a one-shot container by
  # default in every Compose version, so `bin/up.sh` waits for it explicitly.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set dev http://minio:9000 paperos_dev paperos_dev_local &&
      mc mb -p dev/paperos-dev &&
      echo bucket-ready
      "
    restart: 'no'

  # SMTP catcher. The HTTP UI (8025) is always reachable fast, which makes it
  # the stack's compose-smoke health endpoint (see ../smoke.json).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8025/readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  paperos-dev-postgres:
  paperos-dev-minio:
