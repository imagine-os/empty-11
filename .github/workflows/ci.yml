name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # Gate 1. PAP-78 extends this job; downstream checks reference it as `ci / check`.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (lint, typecheck, test, build)
        env:
          VITE_GIT_SHA: ${{ github.sha }}
        run: pnpm turbo lint typecheck test build

      - name: Coverage
        env:
          VITE_GIT_SHA: ${{ github.sha }}
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # Same gate on macOS, kept as a separate job so the required check stays `ci / check`.
  check-macos:
    name: check-macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          VITE_GIT_SHA: ${{ github.sha }}
        run: pnpm turbo lint typecheck test build
