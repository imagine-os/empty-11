roster:
  schemaVersion: 1
  dailyAllowanceUsd: 700
  defaults:
    lead:
      model: claude-opus-5
      fallbackModel: claude-sonnet-5
      effort: high
      permissionMode: acceptEdits
      budget:
        perSessionUsd: 40
        perDayUsd: 35
        maxTurns: 200
      memoryMaxTokens:
        global: 1000
        project: 2000
        character: 3000
      denyList: ops/security/agent-deny.yaml
    sub:
      model: claude-sonnet-5
      fallbackModel: claude-haiku-4-5
      effort: medium
      permissionMode: acceptEdits
      budget:
        perSessionUsd: 15
        perDayUsd: 35
        maxTurns: 80
      memoryMaxTokens:
        global: 1000
        project: 2000
        character: 1500
      denyList: ops/security/agent-deny.yaml
characters:
  - schemaVersion: 1
    name: atlas
    displayName: Atlas
    role: Chief Architect and Orchestrator
    kind: lead
    reportsTo: justin
    description: Use for owns the master plan, decomposes work, dispatches Ready for Claude issues to
      characters, guards dependencies and budget.
    maxParallelSessions: 1
    tools:
      allow: []
      deny:
        - Bash(git push * main)
        - Bash(git push --force*)
        - Bash(rm -rf *)
        - Bash(curl * | sh)
        - Write(.claude/settings.json)
        - Write(ops/secrets/**)
        - Edit(.claude/settings.json)
        - Edit(ops/secrets/**)
    access:
      - linear:admin
      - forgejo:admin:org
      - github:admin:imagine-os
      - budget:write
      - prod:read
    plugins:
      - linear-api
      - github
      - workflow-authoring
    memory:
      path: docs/memory/characters/atlas.md
      maxTokens: 3000
    budget:
      perSessionUsd: 40
      maxTurns: 200
      perDayUsd: 56
      dailySharePct: 8
    escalation:
      - when: "a dependency cycle or phase inversion in the blocks graph: break it before the next dispatch
          and record the fix in the decision log"
        action: proceed
      - when: an irreversible external action, spend from the reserve, reversing an architecture decision,
          anything legal, tax or PCI
        action: needs-justin
      - when: "anything a spec, ADR or rubric already decides: record the default and continue"
        action: proceed
      - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
        action: stop
    linearLabel: Character/Atlas
    subCharacters:
      - dispatcher
      - decomposer
      - merger
  - schemaVersion: 1
    name: dispatcher
    displayName: Dispatcher
    role: Claims issues, spawns sessions in worktrees, moves Linear states
    kind: sub
    reportsTo: atlas
    parent: atlas
    description: Use for claims issues, spawns sessions in worktrees, moves Linear states.
    tools:
      allow: []
      deny: []
    access:
      - prod:read
    memory:
      path: docs/memory/characters/dispatcher.md
      maxTokens: 1500
    budget:
      perSessionUsd: 15
      maxTurns: 80
    escalation:
      - when: anything outside the Dispatcher lane described above
