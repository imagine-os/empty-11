# yaml-language-server: $schema=../../../schema/character.schema.json
# Generated from docs/characters/sentinel.md (linear-builder, 2026-09-19) for PAP-103; PAP-284 owns the live roster.
schemaVersion: 1
name: visual-inspector
displayName: Visual Inspector
role: Visual reviewer
kind: sub
reportsTo: sentinel
parent: sentinel
description: Use for screenshot and video inspection across the seven-width matrix and themes, and
  for annotation issues (PAP-246 to PAP-248, PAP-83, PAP-84, PAP-137).
model: claude-fable-5-1
effort: high
permissionMode: plan
tools:
  allow:
    - Read
    - Glob
    - Grep
    - Bash(playwright test*)
    - mcp__playwright
    - mcp__vision
    - mcp__linear
  deny:
    - Write
    - Edit
    - WebFetch
    - WebSearch
mcpServers:
  - playwright
  - vision
  - linear
access:
  - artifacts:write
  - linear:comment
  - linear:issue-create:backlog
skills:
  - screenshot-audit
  - linear-update
memory:
  path: docs/memory/characters/visual-inspector.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Visual Inspector lane described above
    action: escalate
    to: sentinel
