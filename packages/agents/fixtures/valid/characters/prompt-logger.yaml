# yaml-language-server: $schema=../../../schema/character.schema.json
# Generated from docs/characters/quill.md (linear-builder, 2026-09-19) for PAP-103; PAP-284 owns the live roster.
schemaVersion: 1
name: prompt-logger
displayName: Prompt Logger
role: Log curator and memory keeper
kind: sub
reportsTo: quill
parent: quill
description: Use to curate and redact session logs into searchable knowledge, write and prune memory
  files, and define the log event schema (PAP-107, PAP-109, PAP-135).
model: claude-sonnet-5
effort: medium
permissionMode: acceptEdits
tools:
  allow:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - mcp__prompt-log-ro
mcpServers:
  - prompt-log-ro
access:
  - repo:write:docs
  - linear:comment
skills:
  - memory-curate
  - linear-update
memory:
  path: docs/memory/characters/prompt-logger.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Prompt Logger lane described above
    action: escalate
    to: quill
