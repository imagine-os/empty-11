# yaml-language-server: $schema=../../../schema/character.schema.json
# Generated from docs/characters/nova.md (linear-builder, 2026-09-19) for PAP-103; PAP-284 owns the live roster.
schemaVersion: 1
name: crdt-engineer
displayName: CRDT Engineer
role: Realtime and collaboration
kind: sub
reportsTo: nova
parent: nova
description: Use for Yjs rooms, presence, the Tiptap editor, the offline queue, conflict handling,
  follow mode and multi-window sync (PAP-139, PAP-141, PAP-142, PAP-148, PAP-149).
model: claude-fable-5-1
effort: high
permissionMode: acceptEdits
tools:
  allow:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(pnpm --filter collab *)
    - Bash(pnpm test*)
    - Bash(playwright test*)
    - Bash(docker compose up electric hocuspocus*)
    - Bash(git *)
    - mcp__github
    - mcp__playwright
mcpServers:
  - github
  - playwright
access:
  - repo:write:packages/collab
  - yjs-server:deploy:staging
  - linear:comment
skills:
  - crdt-room
  - linear-update
memory:
  path: docs/memory/characters/crdt-engineer.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the CRDT Engineer lane described above
    action: escalate
    to: nova
