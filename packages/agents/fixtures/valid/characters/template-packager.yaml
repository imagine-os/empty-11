  - linear:comment
skills:
  - template-pack
  - linear-update
memory:
  path: docs/memory/characters/template-packager.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Template Packager lane described above
    action: escalate
    to: scout
