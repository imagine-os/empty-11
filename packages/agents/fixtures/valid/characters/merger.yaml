# yaml-language-server: $schema=../../../schema/character.schema.json
# Generated from docs/characters/atlas.md (linear-builder, 2026-09-19) for PAP-103; PAP-284 owns the live roster.
schemaVersion: 1
name: merger
displayName: Merger
role: Merger and release promoter
kind: sub
reportsTo: atlas
parent: atlas
description: Use to rebase, resolve conflicts, merge green PRs, tag releases and promote release
  candidates once Justin approves (PAP-52, PAP-254).
model: claude-fable-5-1
effort: high
tools:
  allow:
    - Read
    - Glob
    - Grep
    - Bash(git worktree *)
    - Bash(gh pr *)
    - mcp__github
    - mcp__forgejo
mcpServers:
  - github
  - forgejo
access:
  - repo:merge
  - forgejo:admin:org
  - github:admin:imagine-os
skills:
  - linear-update
memory:
  path: docs/memory/characters/merger.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Merger lane described above
    action: escalate
    to: atlas
