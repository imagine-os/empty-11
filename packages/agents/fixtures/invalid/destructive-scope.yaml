# yaml-language-server: $schema=../../schema/roster.schema.json
# expect: DESTRUCTIVE_SCOPE
# a destructive-class scope on a lead that does not report to justin
schemaVersion: 1
characters:
  - schemaVersion: 1
    name: alpha
    displayName: Alpha
    role: Test lead
    kind: lead
    reportsTo: justin
    description: A minimal lead used by the invalid fixtures to isolate one rule.
    tools: { allow: [Read, Grep, 'Bash(pnpm test*)', mcp__linear] }
    mcpServers: [linear]
    access: [linear:comment]
    budget: { perSessionUsd: 60, perDayUsd: 56, maxTurns: 200 }
    linearLabel: Character/Alpha
  - schemaVersion: 1
    name: beta
    displayName: Beta
    role: Test lead
    kind: lead
    reportsTo: alpha
    description: A minimal lead used by the invalid fixtures to isolate one rule.
    tools: { allow: [Read, Grep, 'Bash(pnpm test*)', mcp__linear] }
    mcpServers: [linear]
    access: [linear:comment, linear:delete]
    budget: { perSessionUsd: 60, perDayUsd: 56, maxTurns: 200 }
    linearLabel: Character/Beta
