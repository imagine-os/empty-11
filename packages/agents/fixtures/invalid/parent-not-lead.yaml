# yaml-language-server: $schema=../../schema/roster.schema.json
# expect: PARENT_NOT_LEAD
# a sub whose parent is itself a sub
schemaVersion: 1
characters:
  - schemaVersion: 1
    name: alpha
    displayName: Alpha
    role: Test lead
    kind: lead
    reportsTo: justin
    description: A minimal lead used by the invalid fixtures to isolate one rule.
    tools: { allow: [Read, Grep, 'Bash(pnpm test*)', mcp__linear] }
    mcpServers: [linear]
    access: [linear:comment]
    budget: { perSessionUsd: 60, perDayUsd: 56, maxTurns: 200 }
    linearLabel: Character/Alpha
  - schemaVersion: 1
    name: first
    displayName: Sub
    role: Test sub
    kind: sub
    reportsTo: alpha
    parent: alpha
    description: A minimal sub used by the invalid fixtures to isolate one rule.
    tools: { allow: [Read] }
    budget: { perSessionUsd: 15, maxTurns: 80 }
  - schemaVersion: 1
    name: second
    displayName: Sub
    role: Test sub
    kind: sub
    reportsTo: first
    parent: first
    description: A minimal sub used by the invalid fixtures to isolate one rule.
    tools: { allow: [Read] }
    budget: { perSessionUsd: 15, maxTurns: 80 }
