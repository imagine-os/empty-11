# yaml-language-server: $schema=../schema/character.schema.json
# Live roster (PAP-284). Structure comes from plan.json agents[] through scripts/plan-to-roster.ts;
# everything else is completed by hand from docs/characters/<lead>.md and survives `--merge`.
schemaVersion: 1
name: ops-runner
displayName: Ops Runner
role: VPS, Docker, backups and runners
kind: sub
reportsTo: forge
parent: forge
description: Use for the VPS, Docker, Coolify, Caddy, backups, runners, OpenTelemetry and nightly
  workflows (PAP-25, PAP-26, PAP-30, PAP-45, PAP-50, PAP-253).
tools:
  allow:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - Bash(docker compose *)
    - Bash(ssh vps-staging *)
    - Bash(restic *)
    - Bash(caddy validate*)
    - mcp__coolify
    - mcp__github
mcpServers:
  - coolify
  - github
access:
  - repo:write:ops
  - vps:deploy:staging
  - secrets:read:infra
  - linear:comment
skills:
  - deploy-staging
  - runbook
  - linear-update
memory:
  path: docs/memory/characters/ops-runner.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Ops Runner lane described above
    action: escalate
    to: forge
  - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
    action: stop
