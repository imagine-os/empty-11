# yaml-language-server: $schema=../schema/character.schema.json
# Live roster (PAP-284). Structure comes from plan.json agents[] through scripts/plan-to-roster.ts;
# everything else is completed by hand from docs/characters/<lead>.md and survives `--merge`.
schemaVersion: 1
name: prompt-logger
displayName: Prompt Logger
role: Log curator and memory keeper
kind: sub
reportsTo: quill
parent: quill
description: Use to curate and redact session logs into searchable knowledge, write and prune memory
  files, and define the log event schema (PAP-107, PAP-109, PAP-135).
model: claude-sonnet-5
fallbackModel: claude-haiku-4-5
effort: medium
tools:
  allow:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - mcp__prompt-log-ro
mcpServers:
  - prompt-log-ro
access:
  - repo:write:docs
  - linear:comment
skills:
  - memory-curate
  - linear-update
memory:
  path: docs/memory/characters/prompt-logger.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Prompt Logger lane described above
    action: escalate
    to: quill
  - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
    action: stop
