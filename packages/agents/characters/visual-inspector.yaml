# yaml-language-server: $schema=../schema/character.schema.json
# Live roster (PAP-284). Structure comes from plan.json agents[] through scripts/plan-to-roster.ts;
# everything else is completed by hand from docs/characters/<lead>.md and survives `--merge`.
schemaVersion: 1
name: visual-inspector
displayName: Visual Inspector
role: Visual reviewer
kind: sub
reportsTo: sentinel
parent: sentinel
description: Use for screenshot and video inspection across the seven-width matrix and themes, and
  for annotation issues (PAP-246 to PAP-248, PAP-83, PAP-84, PAP-137).
model: claude-opus-5
effort: high
permissionMode: plan
tools:
  allow:
    - Read
    - Glob
    - Grep
    - Bash(playwright test*)
    - mcp__playwright
    - mcp__vision
    - mcp__linear
  deny:
    - Write
    - Edit
    - WebFetch
    - WebSearch
mcpServers:
  - playwright
  - vision
  - linear
access:
  - artifacts:write
  - linear:comment
  - linear:issue-create:backlog
skills:
  - screenshot-audit
  - linear-update
memory:
  path: docs/memory/characters/visual-inspector.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Visual Inspector lane described above
    action: escalate
    to: sentinel
  - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
    action: stop
