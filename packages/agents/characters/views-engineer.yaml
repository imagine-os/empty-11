# yaml-language-server: $schema=../schema/character.schema.json
# Live roster (PAP-284). Structure comes from plan.json agents[] through scripts/plan-to-roster.ts;
# everything else is completed by hand from docs/characters/<lead>.md and survives `--merge`.
schemaVersion: 1
name: views-engineer
displayName: Views Engineer
role: Views engine
kind: sub
reportsTo: nova
parent: nova
description: Use for the view model to SQL compiler, grid, every view kind, filter builder,
  formulas, saved views, dashboards and PM boards (PAP-163, PAP-165 to PAP-173, PAP-102, PAP-189).
tools:
  allow:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(pnpm --filter views *)
    - Bash(pnpm test*)
    - Bash(pnpm bench*)
    - Bash(psql *)
    - Bash(git *)
    - mcp__github
    - mcp__postgres-ro
mcpServers:
  - github
  - postgres-ro
access:
  - repo:write:packages/views
  - linear:comment
skills:
  - view-kind
  - bench-report
  - linear-update
memory:
  path: docs/memory/characters/views-engineer.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Views Engineer lane described above
    action: escalate
    to: nova
  - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
    action: stop
