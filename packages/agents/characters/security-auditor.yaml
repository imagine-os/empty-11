# yaml-language-server: $schema=../schema/character.schema.json
# Live roster (PAP-284). Structure comes from plan.json agents[] through scripts/plan-to-roster.ts;
# everything else is completed by hand from docs/characters/<lead>.md and survives `--merge`.
schemaVersion: 1
name: security-auditor
displayName: Security Auditor
role: Security reviewer
kind: sub
reportsTo: sentinel
parent: sentinel
description: Use for auth, RLS, secrets, dependency and injection review, the threat model,
  security.json ingestion, DAST and telemetry (PAP-219, PAP-245, PAP-80).
model: claude-opus-5
effort: high
permissionMode: plan
tools:
  allow:
    - Read
    - Glob
    - Grep
    - Bash(semgrep *)
    - Bash(pnpm audit*)
    - Bash(trivy *)
    - Bash(gitleaks *)
    - Bash(git diff*)
    - mcp__github
    - mcp__forgejo
  deny:
    - Write
    - Edit
    - WebFetch
    - WebSearch
mcpServers:
  - github
  - forgejo
access:
  - repo:review
  - linear:comment
skills:
  - review-pr
  - threat-model
  - linear-update
memory:
  path: docs/memory/characters/security-auditor.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Security Auditor lane described above
    action: escalate
    to: sentinel
  - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
    action: stop
