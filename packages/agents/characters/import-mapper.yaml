# yaml-language-server: $schema=../schema/character.schema.json
# Live roster (PAP-284). Structure comes from plan.json agents[] through scripts/plan-to-roster.ts;
# everything else is completed by hand from docs/characters/<lead>.md and survives `--merge`.
schemaVersion: 1
name: import-mapper
displayName: Import Mapper
role: Importer builder
kind: sub
reportsTo: scout
parent: scout
description: Use for schema mapping, dry runs, external id mappings, the CSV and Sheets importer and
  the migration agent interview (PAP-198, PAP-200, PAP-201, PAP-199, PAP-202).
tools:
  allow:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(pnpm --filter import *)
    - Bash(pnpm test*)
    - Bash(git *)
    - mcp__airtable
    - mcp__notion
    - mcp__clickup
    - mcp__quickbooks-sandbox
    - mcp__github
mcpServers:
  - airtable
  - notion
  - clickup
  - quickbooks-sandbox
  - github
access:
  - repo:write:packages/import
  - external-apis:read
  - notion:read
  - linear:comment
skills:
  - importer
  - linear-update
memory:
  path: docs/memory/characters/import-mapper.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Import Mapper lane described above
    action: escalate
    to: scout
  - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
    action: stop
