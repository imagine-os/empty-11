# yaml-language-server: $schema=../schema/character.schema.json
# Live roster (PAP-284). Structure comes from plan.json agents[] through scripts/plan-to-roster.ts;
# everything else is completed by hand from docs/characters/<lead>.md and survives `--merge`.
schemaVersion: 1
name: changelog-scribe
displayName: Changelog Scribe
role: Changelog and digest writer
kind: sub
reportsTo: quill
parent: quill
description: Use to turn merged PRs and conventional commits into human and tenant changelogs and
  the one-page release digest (PAP-133, PAP-89, PAP-52).
model: claude-sonnet-5
fallbackModel: claude-haiku-4-5
effort: medium
tools:
  allow:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(pnpm changelog*)
    - Bash(git *)
    - mcp__github
    - mcp__forgejo
mcpServers:
  - github
  - forgejo
access:
  - repo:write:docs
  - linear:comment
skills:
  - digest
  - linear-update
memory:
  path: docs/memory/characters/changelog-scribe.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Changelog Scribe lane described above
    action: escalate
    to: quill
  - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
    action: stop
