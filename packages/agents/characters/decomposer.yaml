# yaml-language-server: $schema=../schema/character.schema.json
# Live roster (PAP-284). Structure comes from plan.json agents[] through scripts/plan-to-roster.ts;
# everything else is completed by hand from docs/characters/<lead>.md and survives `--merge`.
schemaVersion: 1
name: decomposer
displayName: Decomposer
role: Issue decomposer
kind: sub
reportsTo: atlas
parent: atlas
description: Use to turn briefs, epics and freeform notes into spec-complete issues with the eleven
  contract sections, sizes and blocks relations (PAP-93, PAP-95, PAP-103).
tools:
  allow:
    - Read
    - Glob
    - Grep
    - mcp__linear
mcpServers:
  - linear
access:
  - linear:admin
skills:
  - decompose-brief
  - linear-update
memory:
  path: docs/memory/characters/decomposer.md
  maxTokens: 1500
budget:
  perSessionUsd: 15
  maxTurns: 80
escalation:
  - when: anything outside the Decomposer lane described above
    action: escalate
    to: atlas
  - when: "session at 100 percent of its cap: wip commit, footer, stop (PAP-111)"
    action: stop
