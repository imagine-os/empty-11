# yaml-language-server: $schema=../../schema/page.spec.schema.json
# Generated spec for stress testing
meta:
  id: fx-status-0028
  title:
    id: fx-status-0028.title
    default: Create status
  route: /statuss
  surface: staff
  owner: spec-builder
  status: ready
  specVersion: 1
  tags:

    - generated
    - form
    - status
purpose:
  summary: This is a generated form page for status showing synthetic data for stress testing.
  successMetric: Users can efficiently perform operations on this page.
logic:
  actions:
    createstatus:
      intent:
        id: action.create
        default: create
      permission: status.create
      steps:

        - Perform the create operation on status.
      input:
        id: uuid
    retry:
      intent:
        id: action.retry
        default: retry
      permission: page.view
      steps:

        - Re-run the query.
access:
  view:

    - staff
  actions: {}
data:
  entities:

    - status
  queries:
    items:
      entity: status
      filter:
        op: and
        children: []
      sort:

        - field: updatedAt
          dir: desc
      fields:

        - id
        - name
        - status
        - createdAt
      sync: live
      page: 25
layout:
  template: app
  slots:
    main: {}
    inspector:
      collapsible: true
      defaultCollapsed: true
components:

  - id: ui.heading
    key: title
    props:
      level: 1
      text: page.title
  - id: ui.textInput
    key: nameField
    props:
      label: Name
  - id: ui.button
    key: submitBtn
    props:
      text: Submit
      variant: primary
states:
  loading:
    copy: states.loading
    component: ui.loadingState
  error:
    copy: states.error
    component: ui.errorState
    action: retry
  empty:
    copy: states.empty
  offline:
    copy: states.offline
    component: ui.offlineBanner
    action: retry
  denied:
    copy: states.denied
    component: ui.deniedState
edgeCases:

  - id: edge-case-1
    scenario: User performs action with invalid input
    expected: Page shows validation error
    test: unit
  - id: edge-case-2
    scenario: Network request fails
    expected: Page enters error state
    test: e2e
  - id: edge-case-3
    scenario: User has insufficient permissions
    expected: Page shows access denied message
    test: manual
